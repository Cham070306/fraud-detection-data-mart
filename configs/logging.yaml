# configs/logging.yaml
# Logging configuration for PaySim Fraud Detection Data Mart
# Phan Khai (TV2)

version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: '%(asctime)s [%(levelname)s] %(name)s: %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'
  
  detailed:
    format: '%(asctime)s [%(levelname)s] %(name)s [%(filename)s:%(lineno)d]: %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S'

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout
  
  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/etl.log
    maxBytes: 10485760  # 10MB
    backupCount: 5
    encoding: utf8

loggers:
  etl:
    level: DEBUG
    handlers: [console, file]
    propagate: false
  
  etl.extract:
    level: INFO
  
  etl.transform:
    level: INFO
  
  etl.load_dimensions:
    level: INFO
  
  etl.load_facts:
    level: INFO
  
  etl.reconciliation:
    level: INFO
  
  etl.run:
    level: INFO

root:
  level: WARNING
  handlers: [console, file]
